services:
  - type: web
    name: kirana-aura-farmers
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm --prefix client install && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: VERIFY_TOKEN
        generateValue: true
      - key: ALLOWED_NUMBERS
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
